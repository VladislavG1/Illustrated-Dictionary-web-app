version: '4.28.0'

services:
  db:
    image: postgres:14.12-alpine3.20
    hostname: db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT: 5436
    restart: unless-stopped
    volumes:
      - ./db_django:/var/lib/postgresql/data
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: 'http://${HTTP_PROXY}:${HTTP_PROXY_PORT}'
    restart: always
    command: bash -c "python App/manage.py collectstatic --noinput && python App/manage.py migrate && python App/manage.py runserver 0.0.0.0:8003 --insecure"
    volumes:
      - .:/app
      - static_data:/app/App/static
      - media_data:/app/App/media
    expose:
     - 8003
    ports:
      - '8003:8003'
    depends_on:
      - db
    environment:
      - DB_DATABASE=${DB_DATABASE}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - HTTP_PROXY=${HTTP_PROXY}
  nginx:
    image: nginx:latest
    ports:
      - "83:83"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/ssl/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - static_data:/var/www/html/static
      - media_data:/var/www/html/media
    depends_on:
      - web
  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    volumes:
      - ./certs:/etc/letsencrypt
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nginx
    environment:
      - NGINX_DOCKER_GEN_CONTAINER=nginx
      - EMAIL=${LE_EMAIL}
  
volumes:
  db_django:
  static_data:
  media_data: